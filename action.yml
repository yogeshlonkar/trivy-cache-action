name: 'Cache .trivy'
description: 'Cache .trivy directory using trivy db version sha'
author: 'yogeshlonkar'
inputs:
  prefix:
    description: Prefix for cache key in case multiple workflows pushing cache in  parallel
    required: false
  gh-token:
    description: No longer used, the trivy db version is read from ghcr.io. Kept so existing workflows don't fail.
    required: false
    deprecationMessage: gh-token is no longer used and can be removed.
  upload-chunk-size:
    description: 'The chunk size used to split up large files during upload, in bytes'
    required: false
outputs:
  cache-hit:
    description: 'A boolean value to indicate an exact match was found for the primary key'
runs:
  using: 'node24'
  main: 'dist/restore/index.js'
  post: 'dist/save/index.js'
  post-if: 'success()'
branding:
  icon: 'archive'
  color: 'gray-dark'
