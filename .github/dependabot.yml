version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    # TypeScript 7 is the native compiler and has no JavaScript API, which
    # ncc's ts-loader and typescript-eslint both load, so the build and the
    # lint fail on it (yogeshlonkar/wait-for-jobs#221). TypeScript 6 and
    # anything below 7 still come; drop this once both support TS 7.
    ignore:
      - dependency-name: typescript
        versions: [">= 7"]
