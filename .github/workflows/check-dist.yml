# `dist/restore/index.js` and `dist/save/index.js` are what runs when a
# workflow references this action with `uses:`. They are built from src/, so
# check the committed bundles match a fresh build. `npm run build` also fails
# on a module ncc couldn't resolve, see scripts/check-bundle.sh.
name: Check dist/

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Rebuild the dist/ directory
        run: npm run build
      - name: Compare the expected and actual dist/ directories
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build.  See status below:"
            git diff --stat dist/
            exit 1
          fi
        id: diff

      # If the bundles differ, upload the expected version as an artifact
      - uses: actions/upload-artifact@v7
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        with:
          name: dist
          path: dist/

  # Feeds the `required` check the ruleset on main asks for; workflow.yml has
  # the rest.
  required:
    needs: [check-dist]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.check-dist.result }}
        run: |
          echo "$RESULT"
          [ "$RESULT" = success ]
